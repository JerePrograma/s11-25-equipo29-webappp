# ============================================================
# APP
# ============================================================
spring.application.name=startup-crm
# ============================================================
# DATASOURCE (PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/startupcrm
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool (opcional, pero sano)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# ============================================================
# JPA / HIBERNATE
# ============================================================
# Flyway es el dueño del esquema ? validar contra lo que hay en DB
spring.jpa.hibernate.ddl-auto=validate
# Dialecto (Spring Boot suele deducirlo, pero queda explicito)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Logs SQL (para dev; apagalo en prod)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Guardar todo en UTC en DB (TIMESTAMPTZ + OffsetDateTime)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# En proyecto nuevo NO hace falta baseline_on_migrate
# spring.flyway.baseline-on-migrate=true
# ============================================================
# SERVIDOR WEB
# ============================================================
server.port=8080
# ============================================================
# JSON / ZONAS HORARIAS
# ============================================================
# Respuestas JSON serializadas en horario de Buenos Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
# ============================================================
# LOGGING (ajustable)
# ============================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO
# ============================================================
# JWT / SEGURIDAD
# (En la practica mejor sacarlo a variables de entorno)
# ============================================================
jwt.secret=CAMBIAR_ESTE_SECRETO_POR_UNO_LARGO_Y_UNICO
